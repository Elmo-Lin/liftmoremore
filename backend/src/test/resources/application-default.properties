# Tests always run against the local Firestore emulator (never a real project).
coachlog.firestore.project-id=demo-coachlog-test
coachlog.firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:127.0.0.1:8085}
coachlog.demo.enabled=true
coachlog.google.client-id=test-client
# Fake shop keys (32 / 16 chars). The base URL is a closed port so no test ever reaches NewebPay.
coachlog.newebpay.merchant-id=MS_TEST
coachlog.newebpay.hash-key=0123456789abcdef0123456789abcdef
coachlog.newebpay.hash-iv=fedcba9876543210
coachlog.newebpay.base-url=http://127.0.0.1:9
# Per-IP limits are unit-tested (AuthRateLimiterTests); integration tests sign up many accounts from one address.
coachlog.ratelimit.enabled=false
