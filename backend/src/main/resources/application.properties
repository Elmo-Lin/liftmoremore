spring.application.name=coachlog-backend
server.port=${PORT:8080}

# --- Firestore ---
# Local dev / tests: run the Firebase emulator (see README) and set FIRESTORE_EMULATOR_HOST=127.0.0.1:8085.
# Production: leave the emulator host empty; credentials come from Application Default Credentials.
coachlog.firestore.project-id=${GOOGLE_CLOUD_PROJECT:demo-coachlog}
coachlog.firestore.database-id=${FIRESTORE_DATABASE_ID:(default)}
coachlog.firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:}

# --- Auth ---
# HS256 signing secret (>= 32 bytes). MUST be overridden in production via COACHLOG_JWT_SECRET.
coachlog.jwt.secret=${COACHLOG_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
coachlog.jwt.ttl-hours=${COACHLOG_JWT_TTL_HOURS:168}

# --- CORS: comma-separated frontend origins ---
coachlog.cors.allowed-origins=${COACHLOG_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# --- Demo mode: enables /api/demo/* (data import/reset) and the demo coach account. Never enable in production. ---
coachlog.demo.enabled=${COACHLOG_DEMO_ENABLED:false}
coachlog.demo.password=${COACHLOG_DEMO_PASSWORD:demo1234}
