spring.application.name=coachlog-backend
server.port=${PORT:8080}

# --- Firestore ---
# Local dev / tests: run the Firebase emulator (see README) and set FIRESTORE_EMULATOR_HOST=127.0.0.1:8085.
# Production: leave the emulator host empty; credentials come from Application Default Credentials.
coachlog.firestore.project-id=${GOOGLE_CLOUD_PROJECT:demo-coachlog}
coachlog.firestore.database-id=${FIRESTORE_DATABASE_ID:(default)}
coachlog.firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:}

# --- Auth ---
# HS256 signing secret (>= 32 bytes). MUST be overridden in production via COACHLOG_JWT_SECRET.
coachlog.jwt.secret=${COACHLOG_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
coachlog.jwt.ttl-hours=${COACHLOG_JWT_TTL_HOURS:168}

# --- CORS: comma-separated frontend origins ---
coachlog.cors.allowed-origins=${COACHLOG_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# --- Demo mode: enables /api/demo/* (data import/reset) and the demo coach account. Never enable in production. ---
coachlog.demo.enabled=${COACHLOG_DEMO_ENABLED:false}
coachlog.demo.password=${COACHLOG_DEMO_PASSWORD:demo1234}

# --- Public URLs: where NewebPay sends the browser back (the app) and posts results (this API). ---
coachlog.app-url=${COACHLOG_APP_URL:http://localhost:5173}
coachlog.api-url=${COACHLOG_API_URL:http://localhost:8080/api}

# --- Google sign-in: the OAuth client ID (Web application) from Google Cloud Console. Empty = off. ---
coachlog.google.client-id=${GOOGLE_CLIENT_ID:}

# --- NewebPay (藍新金流). Empty = online payment off. Sandbox: https://ccore.newebpay.com, live: https://core.newebpay.com ---
coachlog.newebpay.merchant-id=${NEWEBPAY_MERCHANT_ID:}
coachlog.newebpay.hash-key=${NEWEBPAY_HASH_KEY:}
coachlog.newebpay.hash-iv=${NEWEBPAY_HASH_IV:}
coachlog.newebpay.base-url=${NEWEBPAY_BASE_URL:https://ccore.newebpay.com}

# --- Email (password resets) via Resend. Empty key = nothing is sent (the message is only logged). ---
coachlog.mail.resend-api-key=${COACHLOG_RESEND_API_KEY:}
coachlog.mail.from=${COACHLOG_MAIL_FROM:Lift More More <noreply@liftmoremore.com>}
# Log the whole message (including reset links) when no key is set. Local development only.
coachlog.mail.log-body=${COACHLOG_MAIL_LOG_BODY:false}
